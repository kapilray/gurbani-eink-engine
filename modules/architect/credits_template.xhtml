<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="pa" lang="pa">
<head>
  <meta charset="utf-8"/>
  <title>Contributions</title>
  <link rel="stylesheet" type="text/css" href="styles/gurbani_base.css"/>
  <style>
    body {
      font-family: 'TiroGurmukhi', serif;
      padding: 3em 2em;
      color: #1a1a1a;
    }
    .credits-heading {
      font-size: 1.3em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid #888;
      padding-bottom: 0.4em;
      margin-bottom: 1.8em;
      font-family: serif;
      color: #333;
    }
    .credit-row {
      display: flex;
      margin-bottom: 1.2em;
      align-items: baseline;
      gap: 1em;
    }
    .credit-label {
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      min-width: 7em;
      font-family: serif;
    }
    .credit-value {
      font-size: 1em;
      color: #1a1a1a;
      font-family: serif;
    }
    .credit-value a {
      color: #5a4030;
      text-decoration: none;
      border-bottom: 1px solid #c8a882;
    }
    .rule {
      border: none;
      border-top: 1px solid #ddd;
      margin: 2.4em 0;
    }
    .gurbani-credit {
      font-size: 1.1em;
      line-height: 1.9;
      color: #3a2a1a;
      margin-top: 2em;
      font-family: 'TiroGurmukhi', serif;
    }
  </style>
</head>
<body>

  <p class="credits-heading">Contributions</p>

  <!-- ART CREDIT — replace with artist's actual name/link when received -->
  <div class="credit-row">
    <span class="credit-label">Cover Art</span>
    <span class="credit-value">
      <a href="{{ARTIST_URL}}">{{ARTIST_NAME}}</a>
    </span>
  </div>

  <div class="credit-row">
    <span class="credit-label">Gurbani Data</span>
    <span class="credit-value">
      <a href="https://shabados.com">Shabad OS</a>
    </span>
  </div>

  <div class="credit-row">
    <span class="credit-label">Development</span>
    <span class="credit-value">Gurbani-EInk Team</span>
  </div>

  <div class="credit-row">
    <span class="credit-label">Font</span>
    <span class="credit-value">Tiro Gurmukhi — Tiro Typeworks (OFL License)</span>
  </div>

  <hr class="rule"/>

  <!-- Source text credit in Gurmukhi -->
  <p class="gurbani-credit">
    <span class="word">ਸ੍ਰੀ</span> <span class="word">ਗੁਰੂ</span> <span class="word">ਗ੍ਰੰਥ</span> <span class="word">ਸਾਹਿਬ</span> <span class="word">ਜੀ</span>
  </p>
  <p class="gurbani-credit" xml:lang="en" lang="en" style="font-family: serif; font-size: 0.85em; color: #666;">
    Source text from Sri Guru Granth Sahib Ji. This composition is in the public domain.
  </p>

</body>
</html>
